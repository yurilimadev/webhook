<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Simulador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <p style="font-weight: bold; margin:5px;">SIMULADOR DE WEBHOOK</p>
        <div>
            <p>Adicione o Endpoint da usa aplicação para poder receber os disparos da simulação.</p>
        </div>
        <form action="{{ url_for('cadastrar') }}" method="POST">
            <input type="text" placeholder="Endpoint" name="endpoint" required>
            <input type="email" placeholder="Email" name="email" required>
            <button type="submit">CADASTRAR</button>
        </form>
    </div>
    
</body>
</html>
